dataset:
  type: lerobot
  repo_id: lerobot/libero_10
  split: train
  cache_dir: null
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 1
  episode_key: episode_index
  frame_key: frame_index
  key_mapping:
    pixels: observation.images.top
    action: action
    proprio: observation.state
  keys_to_load:
    - pixels
    - action
    - proprio
